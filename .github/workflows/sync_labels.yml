name: Sync Labels

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  push:
    branches:
      - main
    paths:
      - '.github/labels.yml'
  workflow_dispatch:

jobs:
  labels:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repository:
          - Aegis-AI-Organizations/Aegis-AI-Agent
          - Aegis-AI-Organizations/Aegis-AI-Api-Gateway
          - Aegis-AI-Organizations/Aegis-AI-Brain
          - Aegis-AI-Organizations/Aegis-AI-Dashboard
          - Aegis-AI-Organizations/Aegis-AI-Infra
          - Aegis-AI-Organizations/Aegis-AI-Proto
          - Aegis-AI-Organizations/Aegis-AI-Worker-Deployer
          - Aegis-AI-Organizations/Aegis-AI-Worker-Fixer
          - Aegis-AI-Organizations/Aegis-AI-Worker-Ingest
          - Aegis-AI-Organizations/Aegis-AI-Worker-Pentest
          - Aegis-AI-Organizations/Aegis-Documentation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Strict Sync from YAML
        run: |
          for label in "bug" "documentation" "duplicate" "enhancement" "good first issue" "help wanted" "invalid" "question" "wontfix" "priority: P0-critical" "priority: P1-high" "priority: P2-medium" "priority: P3-low" "type: task" "type: feature" "type: tech-debt" "type: docs" "status: blocked" "status: in-progress" "status: review-required" "area: security" "area: infra" "env: production" "env: staging" "impact: breaking-change"; do
            gh label delete "$label" --yes 2>/dev/null || true
          done

          # Use gh api to fetch and set labels to bypass yq parsing issues
          yq e -o=json .github/labels.yml > /tmp/labels.json
          
          jq -c '.[]' /tmp/labels.json | while read -r label_json; do
            name=$(echo "$label_json" | jq -r '.name')
            color=$(echo "$label_json" | jq -r '.color')
            desc=$(echo "$label_json" | jq -r '.description')
            
            echo "Syncing label: $name"
            # Try to edit, if it fails (404), create it. Redirect 404 stderr to null.
            gh label edit "$name" --color "$color" --description "$desc" 2>/dev/null || \
            gh label create "$name" --color "$color" --description "$desc"
          done
        env:
          GH_TOKEN: ${{ secrets.ORG_PAT }}
          GH_REPO: ${{ matrix.repository }}